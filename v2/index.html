<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Quadro da sprint</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#f4f6fb;--paper:#fff;--ink:#18213a;--muted:#5d6681;--line:#d9e0ef;
  --blue:#0047cf;--blue2:#0a2f8a;--blueL:#e6edfc;--orange:#ed741e;--orangeL:#fdeee2;
  --ok:#1d7a40;--okL:#e1f4e7;--warn:#8a6200;--warnL:#fff3c9;--no:#b23a2a;--noL:#fbe5e1;
  --display:Anton,Impact,"Arial Narrow",sans-serif;--body:Poppins,"Segoe UI",Arial,sans-serif;
  --fs:clamp(14px,0.45vw + 8px,20px)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:400 var(--fs)/1.4 var(--body)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
.disp{font-family:var(--display);font-weight:400;text-transform:uppercase;letter-spacing:.02em;line-height:1}
/* topo */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:35;display:flex;align-items:center;gap:.6em;flex-wrap:wrap;padding:.5em 1em;background:var(--paper);border-bottom:3px solid var(--orange)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:36;background:var(--paper)}
.brand{font-family:var(--display);font-size:1.35em;color:var(--blue);text-transform:uppercase}
.brand small{font-family:var(--body);font-size:.5em;color:var(--muted);text-transform:none;margin-left:.5em}
.tabs{display:flex;gap:.3em;margin-left:.6em}
.tab{border:1.5px solid var(--line);background:var(--paper);color:var(--blue2);border-radius:99px;padding:.25em .9em;font-weight:600;font-size:.85em}
.tab.on{background:var(--blue);border-color:var(--blue);color:#fff}
.sp{flex:1}
.sync{font-size:.72em;color:var(--muted)}
.sync[data-k=ok]::before{content:"● ";color:var(--ok)}
.sync[data-k=warn]{color:var(--no)}
.btn{border:1.5px solid var(--line);background:var(--paper);color:var(--blue2);border-radius:9px;padding:.4em .9em;font-weight:600}
.etl{display:flex;flex-direction:column;gap:6px;margin:.3em 0 .5em;counter-reset:et}.etr .etn::before{counter-increment:et;content:counter(et)".";font-weight:700;color:var(--muted);min-width:1.4em;display:inline-block}.etr .etnm{flex:1;min-width:0}.etr input[type=date]{width:auto}.etl:empty::after{content:"Nenhuma etapa ainda.";font-size:.85em;color:var(--muted)}
.fsec{border-top:1px solid var(--line,#e2e8f0);padding-top:.7em;display:flex;flex-direction:column;gap:.45em}.fsec:first-of-type{border-top:0;padding-top:0}
.fsec h3{font-size:.8em;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--blue2);margin:0}.fsec>.ct{margin:-.2em 0 .1em}
details.fsec>summary{list-style:none;cursor:pointer;display:flex;gap:.6em;align-items:baseline;flex-wrap:wrap}details.fsec>summary::before{content:"▸";color:var(--muted)}details.fsec[open]>summary::before{content:"▾"}details.fsec>summary h3{display:inline}
.fgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.6em .8em}.fgrid .fnome{grid-column:1/-1}@media(max-width:640px){.fgrid{grid-template-columns:1fr}}
.lh,.lr{display:grid;gap:6px;align-items:center}.lh{font-size:.7em;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}.lh>span{text-align:left}
.lh-ets,.ll-ets .lr{grid-template-columns:22px 44px minmax(0,1fr) 150px 150px 32px 32px}
.lh-mcs,.ll-mcs .lr{grid-template-columns:22px 150px minmax(0,1fr) 32px 32px}
.lh-ats,.ll-ats .lr,.lh-mod,.ll-mod .lr{grid-template-columns:22px minmax(0,1fr) 32px 32px}
.ll{display:flex;flex-direction:column;gap:6px;counter-reset:ln}.ll:empty::after{content:attr(data-vazio);font-size:.85em;color:var(--muted);padding:.2em 0}.ll:empty+*{margin-top:0}
.lr .ln::before{counter-increment:ln;content:counter(ln)".";font-weight:700;color:var(--muted)}.lr input{min-width:0;width:100%}.lr input[type=radio]{width:auto}.latual{display:flex;justify-content:center}
.ll+.btn{align-self:flex-start}.lh:has(+.ll:empty){display:none}
@media(max-width:640px){.lh-ets,.ll-ets .lr{grid-template-columns:22px 30px minmax(0,1fr) 32px 32px}.ll-ets .l2,.ll-ets .l3{grid-column:3}.lh-ets span:nth-child(n+4){display:none}}
.mini{margin:.35em 0 .2em}.mpas{display:flex;align-items:center}.mp{flex:none}.mp b{display:inline-flex;align-items:center;justify-content:center;width:1.9em;height:1.9em;border-radius:99px;border:2px solid var(--line);background:var(--paper);font-size:.72em;font-weight:800;color:var(--muted)}
.mp.ok b{background:var(--ok);border-color:var(--ok);color:#fff}.mp.agora b{background:var(--orange);border-color:var(--orange);color:#fff;box-shadow:0 0 0 3px var(--orangeL)}.ml{flex:1;height:2px;background:var(--line);min-width:.6em}.mp.ok+.ml{background:var(--ok)}
.mnow{font-size:.8em;color:var(--muted);margin-top:.3em}.mnow b{color:var(--ink)}
.gant{display:flex;flex-direction:column;gap:.3em;margin:.3em 0 .2em}
.gr{display:grid;grid-template-columns:minmax(9em,15em) minmax(0,1fr) 7.5em;gap:.7em;align-items:center}
.gn{font-weight:600;font-size:.86em;line-height:1.2}.gd{font-size:.78em;color:var(--muted);white-space:nowrap}
.gt{position:relative;height:1.6em;background:var(--bg);border-radius:6px}
.gcab .gt{background:none;height:1.5em}.gcab .gt span{position:absolute;bottom:0;transform:translateX(-50%);font-size:.7em;color:var(--muted);white-space:nowrap}
.gcab .hj{position:absolute;top:-.2em;transform:translateX(-50%);font-size:.66em;font-weight:800;font-style:normal;color:#fff;background:#c99700;border-radius:99px;padding:0 .5em;z-index:2}
.gl{position:absolute;top:0;bottom:0;width:1px;background:rgba(100,116,139,.13)}.gl.ano{background:rgba(100,116,139,.35)}
.gh{position:absolute;top:-.2em;bottom:-.2em;width:2px;margin-left:-1px;background:#c99700;z-index:2}
.gp{position:absolute;top:-.2em;bottom:-.2em;width:0;border-left:2px dashed var(--blue);z-index:2}
.gb{position:absolute;top:.25em;bottom:.25em;border-radius:5px;z-index:1}.gb.ok{background:var(--ok)}.gb.agora{background:var(--blue)}.gb.fut{background:rgba(37,99,235,.08);border:2px dashed var(--blue)}
.gmk .gt{background:none;border-top:1px dashed var(--line)}
.gm{position:absolute;transform:translateX(-50%);font-size:.66em;font-weight:800;color:#fff;background:var(--no);border-radius:4px;padding:.1em .4em;z-index:3;white-space:nowrap;cursor:default}.gm.pass{background:#94a3b8}
.gm.inl{position:static;transform:none;display:inline-block}tr.mpass td{color:var(--muted)}
.gleg{display:flex;gap:1.2em;flex-wrap:wrap;font-size:.74em;color:var(--muted);margin:.1em 0 .6em}.gleg span{display:flex;align-items:center;gap:.4em}.gleg i{display:inline-block;width:14px;height:0;border-top:2px solid}
.gleg .lh{border-color:#c99700}.gleg .lp{border-top:2px dashed var(--blue)}.gleg .lm{width:10px;height:10px;border:0;background:var(--no);border-radius:2px}
@media(max-width:640px){.gr{grid-template-columns:7em minmax(0,1fr)}.gd{display:none}}
select.alerta{border-color:var(--orange)!important;box-shadow:0 0 0 3px var(--orangeL)}
.lnk.bkt{text-align:left;font:inherit;color:var(--ink);padding:0;display:block}.lnk.bkt:hover{color:var(--blue);text-decoration:underline}
.bki{display:flex;align-items:center;gap:.5em}.bki .bkc{flex:1;min-width:0}.bki .bt{margin-left:auto}
.bkn{font-weight:700;color:var(--muted);font-size:.88em;min-width:2.2em;font-variant-numeric:tabular-nums}.bkn.big{font-size:.8em;min-width:0;margin-right:.2em}
.alca{cursor:grab;color:var(--muted);font-size:.8em;letter-spacing:-2px;user-select:none}.bki.arr{cursor:grab}.bki.arrastando{opacity:.4}
.bki.antes{box-shadow:inset 0 3px 0 var(--blue)}.bki.depois{box-shadow:inset 0 -3px 0 var(--blue)}
.btn.no{color:var(--no);border-color:var(--no)}.btn.pri.no{background:var(--no);color:#fff}.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.or{background:var(--orange);border-color:var(--orange);color:#fff}
.btn.big{font-size:1.15em;padding:.6em 1.4em;border-radius:12px}
.btn.sm{font-size:.78em;padding:.25em .65em}
main{padding:1em;max-width:1900px;margin:0 auto}
.empty{color:var(--muted);font-size:.85em}
h1,h2,h3{margin:0}
/* ===== abertura ===== */
.abre{max-width:1300px;margin:1.5em auto;display:flex;flex-direction:column;gap:1.2em}
.abre h1{font-family:var(--display);font-weight:400;font-size:3.6em;color:var(--blue);text-transform:uppercase;line-height:1}
.abre .sub{color:var(--muted);margin:.3em 0 0;font-size:1.05em}
.abre .obj{background:var(--blue);color:#fff;border-radius:12px;padding:.8em 1em}
.abre .obj b{font-family:var(--display);font-weight:400;text-transform:uppercase;color:#ffd2b0;margin-right:.5em}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(11em,1fr));gap:.8em}
.stat{background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:.8em 1em;display:flex;flex-direction:column;gap:.2em}
.stat b{font-family:var(--display);font-weight:400;font-size:2.6em;line-height:1;color:var(--blue2)}
.stat span{font-size:.8em;color:var(--muted);font-weight:600}
.stat.ok b{color:var(--ok)}.stat.no b{color:var(--no)}.stat.or b{color:var(--orange)}
.stat .bar{height:.5em;border-radius:99px;background:var(--line);overflow:hidden;margin-top:.3em;position:relative}
.stat .bar i{display:block;height:100%;background:var(--ok)}
.stat .bar u{position:absolute;top:-2px;bottom:-2px;width:3px;background:var(--ink)}
.abre .acts{display:flex;gap:.8em;flex-wrap:wrap;align-items:center}
.abre .ordem{font-size:.9em;color:var(--muted)}
.abre .ordem b{color:var(--ink)}
.abre .ordem.girando b{color:var(--orange)}
/* ===== vez ===== */
.faixa{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:1.2em;align-items:center;background:var(--blue);color:#fff;border-radius:16px;padding:.8em 1.2em;margin-bottom:.8em}
.quem small{font-size:.75em;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:#ffd2b0}
.quem .nl{display:flex;align-items:center;gap:.6em;flex-wrap:wrap}
.quem .nm{font-family:var(--display);font-size:4em;text-transform:uppercase;line-height:1;margin:.05em 0 .15em}
.quem .ausb{border:1.5px solid rgba(255,255,255,.5);background:none;color:#fff;border-radius:99px;padding:.15em .8em;font-size:.75em;font-weight:600}
.fila{display:flex;gap:.35em;flex-wrap:wrap}
.fila button{border:0;color:#fff;font-size:.8em;font-weight:600;padding:.2em .8em;border-radius:99px;background:rgba(255,255,255,.14)}
.fila button:hover{background:rgba(255,255,255,.3)}
.fila button.ja{opacity:.5;text-decoration:line-through}.fila button.vez{background:var(--orange)}
.fila button.aus{opacity:.4;font-style:italic;text-decoration:line-through}
/* bolha do timer */
.bolha{--ts:170px;position:fixed;z-index:30;width:var(--ts);height:var(--ts);bottom:24px;left:24px;border-radius:50%;background:#0b1a33;color:#fff;box-shadow:0 8px 28px rgba(0,20,60,.4);touch-action:none;cursor:grab;user-select:none}
.bolha.drag{cursor:grabbing}
.bolha svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.bolha .trk{fill:none;stroke:rgba(255,255,255,.14);stroke-width:7}
.bolha .arc{fill:none;stroke:#3d7bff;stroke-width:7;stroke-linecap:round;transition:stroke-dashoffset .4s linear,stroke .3s}
.bolha[data-k=warn] .arc{stroke:var(--orange)}.bolha[data-k=over] .arc{stroke:#e5484d}
.bolha .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--ts)*.04)}
.bolha .clk{font-family:var(--display);font-size:calc(var(--ts)*.26);line-height:1;font-variant-numeric:tabular-nums}
.bolha[data-k=over] .clk{color:#ff8a8d}
.bolha .tb{display:flex;gap:4px}
.bolha .tb button{border:0;border-radius:99px;background:rgba(255,255,255,.16);color:#fff;font-weight:700;font-size:max(10px,calc(var(--ts)*.075));padding:calc(var(--ts)*.025) calc(var(--ts)*.07)}
.bolha .rs{position:absolute;right:5%;bottom:5%;width:18px;height:18px;border-radius:50%;background:var(--orange);border:2px solid #fff;cursor:nwse-resize;opacity:.5}
.bolha:hover .rs{opacity:.95}
/* QR */
.qrov{position:fixed;inset:0;z-index:45;background:rgba(10,47,138,.75);display:flex;align-items:center;justify-content:center;padding:16px}
.qrgr{background:#fff;border-radius:20px;padding:28px 32px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;max-width:520px}
.qrgr h2{font-family:var(--display);font-weight:400;text-transform:uppercase;color:var(--blue);font-size:2.2em;margin:0}
.qrgr p{margin:0;color:var(--muted)}
.qrtab{position:fixed;right:0;bottom:40px;z-index:25;border:0;border-radius:10px 0 0 10px;background:var(--orange);color:#fff;font-weight:700;font-size:13px;padding:12px 8px;box-shadow:0 4px 14px rgba(0,20,60,.3)}
.ctl{display:flex;flex-direction:column;gap:.45em;align-items:stretch}
.ctl .row{display:flex;gap:.45em}
.ctl button{border:1.5px solid rgba(255,255,255,.55);background:none;color:#fff;border-radius:10px;padding:.45em .9em;font-weight:700}
.ctl button.pri{background:var(--orange);border-color:var(--orange);font-size:1.15em;padding:.6em 1.2em}
.ctl .tot{font-size:.75em;opacity:.85;text-align:center}
.perg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.6em;margin-bottom:.8em}
.perg button{border:2px solid var(--line);background:var(--paper);border-radius:12px;padding:.55em .9em;text-align:left;display:flex;gap:.6em;align-items:center;color:var(--muted);font-weight:600}
.perg button .n{font-family:var(--display);font-size:1.7em;line-height:1;color:var(--line)}
.perg button.on{border-color:var(--orange);background:var(--orangeL);color:var(--ink)}
.perg button.on .n{color:var(--orange)}
/* kanban */
.kb{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.7em}
.col{background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:.6em;display:flex;flex-direction:column;gap:.5em;min-height:14em;transition:opacity .25s,border-color .25s}
.col.dim{opacity:.4}
.col.on{border-color:var(--orange);box-shadow:0 0 0 4px var(--orangeL)}
.col.over{background:var(--orangeL)}
.col>h3{font-family:var(--display);font-weight:400;text-transform:uppercase;font-size:1.25em;color:var(--blue2);display:flex;justify-content:space-between;align-items:center}
.col>h3 i{font-style:normal;font-family:var(--body);font-size:.6em;font-weight:700;background:var(--bg);border-radius:99px;padding:.1em .6em;color:var(--muted)}
.col[data-c=prev]>h3{color:var(--blue)}.col[data-c=and]>h3{color:var(--orange)}.col[data-c=trav]>h3{color:var(--no)}.col[data-c=conc]>h3{color:var(--ok)}
.card{background:var(--paper);border:1.5px solid var(--line);border-left:6px solid var(--blue);border-radius:10px;padding:.55em .7em;display:flex;flex-direction:column;gap:.3em}
.card[data-c=and]{border-left-color:var(--orange)}
.card[data-c=trav]{border-left-color:var(--no);background:var(--noL)}
.card[data-c=conc]{border-left-color:var(--ok);background:var(--okL)}
.card[draggable=true]{cursor:grab}
.card .t{font-weight:600;font-size:1.02em;line-height:1.3;overflow-wrap:anywhere}
.card[data-c=conc] .t{color:var(--muted)}
.card .m{font-size:.75em;color:var(--blue2);font-weight:500}
.tags{display:flex;flex-wrap:wrap;gap:.3em}
.tag{font-size:.66em;font-weight:700;text-transform:uppercase;letter-spacing:.03em;border-radius:99px;padding:.1em .6em;background:var(--blueL);color:var(--blue2)}
.tag.late{background:var(--noL);color:var(--no)}.tag.due{background:var(--warnL);color:var(--warn)}
.tag.np{background:var(--orangeL);color:var(--orange)}.tag.pri{background:var(--orange);color:#fff}
.tag.mud{background:#fff3c9;color:#8a6200}
.trava{font-size:.8em;background:var(--paper);border-radius:7px;padding:.35em .5em;border:1px dashed rgba(178,58,42,.4)}
.trava b{color:var(--no)}
.trava ul{margin:.2em 0 0;padding-left:1.1em}
.trava li.ok{color:var(--ok);text-decoration:line-through}
.ca{display:flex;gap:.35em;align-items:center}
.ca .go{flex:1;border:0;border-radius:8px;padding:.35em .6em;font-weight:700;font-size:.85em;background:var(--blue);color:#fff}
.card[data-c=and] .ca .go{background:var(--ok)}
.card[data-c=trav] .ca .go{background:var(--no)}
.ca .mais{border:1.5px solid var(--line);background:var(--paper);border-radius:8px;padding:.25em .6em;font-weight:800;color:var(--muted)}
.card.flash{animation:flash 2s ease}
@keyframes flash{0%,40%{box-shadow:0 0 0 5px var(--orange)}100%{box-shadow:0 0 0 0 transparent}}
.more{font-size:.75em;color:var(--muted);text-align:center}
.foot{margin-top:auto;display:flex;flex-direction:column;gap:.4em}
.puxar{border:1.5px dashed var(--line);background:none;border-radius:9px;padding:.4em;color:var(--blue2);font-weight:600;font-size:.82em}
.novo{display:flex;gap:.3em}
.novo input{flex:1;min-width:0;border:1.5px dashed var(--line);border-radius:9px;padding:.4em .6em;font-size:.82em;background:var(--bg)}
.novo input:focus{border-style:solid;border-color:var(--blue);background:#fff;outline:0}
.novo button{border:0;background:var(--blue);color:#fff;border-radius:9px;padding:0 .8em;font-weight:800}
/* ===== fim ===== */
.fim{max-width:1100px;margin:1em auto;display:flex;flex-direction:column;gap:1em}
.fim h1{font-family:var(--display);font-weight:400;font-size:3em;color:var(--blue);text-transform:uppercase}
.fbox{background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:1em}
.fbox h2{font-family:var(--display);font-weight:400;text-transform:uppercase;color:var(--blue2);font-size:1.4em;margin-bottom:.5em}
.fl{display:flex;flex-direction:column;gap:.5em}
.fi{display:grid;grid-template-columns:8em minmax(0,1fr) auto;gap:.8em;align-items:center;border-left:6px solid var(--no);background:var(--noL);border-radius:0 10px 10px 0;padding:.5em .8em}
.fi .p{font-weight:700}
.fi small{display:block;color:var(--muted);font-size:.8em}
/* ===== minha raia ===== */
.eu{max-width:1500px;margin:0 auto}
.euh{display:flex;justify-content:space-between;align-items:flex-end;gap:.6em;margin-bottom:.8em;flex-wrap:wrap}
.euh h1{font-family:var(--display);font-weight:400;font-size:2.6em;color:var(--blue);text-transform:uppercase;line-height:1}
.euh .d{color:var(--muted);font-size:.85em}
.aviso{border-radius:12px;padding:.6em .9em;margin-bottom:.8em;font-weight:600;background:var(--blueL);color:var(--blue2)}
.aviso.sua{background:var(--orange);color:#fff;font-size:1.1em}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(9em,1fr));gap:.6em;max-width:700px;margin:1em auto}
.pick button{padding:1em;border:2px solid var(--line);background:var(--paper);border-radius:12px;font-weight:700;font-size:1.1em}
/* ===== sprint ===== */
.box{background:var(--paper);border:1.5px solid var(--line);border-radius:14px;padding:1em;margin:0 auto .9em;max-width:1200px}
.box h2{font-family:var(--display);font-weight:400;text-transform:uppercase;color:var(--blue2);font-size:1.35em;margin-bottom:.6em}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(13em,1fr));gap:.6em}
.form .wide{grid-column:1/-1}
label.f{display:flex;flex-direction:column;gap:.25em;font-size:.78em;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
label.f input,label.f select,label.f textarea{border:1.5px solid var(--line);border-radius:9px;padding:.45em .55em;font-size:1.2em;font-weight:400;text-transform:none;letter-spacing:0;color:var(--ink);background:#fff}
.capt{width:100%;border-collapse:collapse;font-size:.9em}
.capt th{text-align:left;color:var(--muted);font-weight:600;font-size:.78em;padding:.3em .4em;border-bottom:1px solid var(--line)}
.capt td{padding:.35em .4em;border-bottom:1px solid var(--bg)}

.encaixar button{border:1.5px solid var(--line);background:var(--paper);border-radius:10px;padding:.35em .7em;text-align:left;font-size:.85em;max-width:22em}
.encaixar button.on{border-color:var(--orange);background:var(--orangeL)}
.encaixar button small{display:block;color:var(--muted);font-size:.8em}
.nums{display:grid;grid-template-columns:repeat(auto-fit,minmax(8em,1fr));gap:.5em;margin-bottom:.6em}
.nums div{background:var(--bg);border-radius:10px;padding:.45em .7em}
.nums b{font-family:var(--display);font-weight:400;font-size:1.6em;display:block;line-height:1.1}
.nums span{font-size:.72em;color:var(--muted);font-weight:600}
.nums .no b{color:var(--no)}.nums .ok b{color:var(--ok)}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:99px;overflow:hidden}
.seg button{border:0;background:var(--paper);padding:.3em 1em;font-weight:600;color:var(--blue2)}
.seg button.on{background:var(--blue);color:#fff}
/* ===== projetos ===== */
.pj{background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:.9em;display:flex;flex-direction:column;gap:.45em}
.pj h3{font-size:1.1em;display:flex;justify-content:space-between;gap:.5em;align-items:baseline}
.pj h3 small{font-size:.62em;color:var(--muted);font-weight:700;text-transform:uppercase}
.pj .q{font-size:.82em;color:var(--muted)}
.etapas{display:flex;flex-wrap:wrap;gap:.3em}
.etapas span{font-size:.72em;font-weight:600;padding:.15em .6em;border-radius:99px;background:var(--bg);color:var(--muted)}
.etapas span.feita{background:var(--okL);color:var(--ok)}.etapas span.atual{background:var(--orange);color:#fff}
.stt{font-size:.68em;font-weight:800;text-transform:uppercase;padding:.15em .6em;border-radius:99px;white-space:nowrap}
.stt.ok{background:var(--okL);color:var(--ok)}.stt.risco{background:var(--warnL);color:var(--warn)}.stt.trav{background:var(--noL);color:var(--no)}
/* ===== revisão ===== */
.big2{display:grid;grid-template-columns:repeat(auto-fit,minmax(13em,1fr));gap:.8em;margin-bottom:.8em}
.big2 div{background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:.9em 1em}
.big2 b{font-family:var(--display);font-weight:400;font-size:2.8em;line-height:1;display:block;color:var(--blue2)}
.big2 span{color:var(--muted);font-size:.85em;font-weight:600}
.retro{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.8em}
.retro>div{border:2px dashed var(--line);border-radius:12px;padding:.8em;display:flex;flex-direction:column;gap:.4em;min-height:9em}
.retro h3{font-size:.95em;text-transform:uppercase;color:var(--orange)}
.retro ul{margin:0;padding-left:1.1em}.retro li small{color:var(--muted)}
.retro .novo{margin-top:auto}
/* celular e telas estreitas */
@media(max-width:1000px){
  .faixa{grid-template-columns:minmax(0,1fr)}.ctl{flex-direction:row;flex-wrap:wrap}
  .quem .nm{font-size:2.6em}
  .perg{grid-template-columns:1fr}
  .kb{grid-template-columns:1fr}.col{min-height:0}
  .fi{grid-template-columns:1fr}
  .passos{grid-template-columns:1fr 1fr}.br{grid-template-columns:6em minmax(0,1fr)}.br .v{grid-column:1/-1;text-align:left}
  .retro{grid-template-columns:1fr}.tabs{margin-left:0;flex-wrap:wrap}
}
body.membro .adm{display:none!important}
body:not(.admin) .adm{display:none!important}
body.leitura .tabs .tab.ver{display:inline-block!important}
body.leitura [data-a="rfeito"],body.leitura [data-a="atedit"]{pointer-events:none}
body.leitura .tabs .tab.raia,body.semraia .tabs .tab.raia{display:none!important}
body.leitura .novo,body.leitura .puxar,body.leitura .dacts>.btn,body.leitura .pj .dacts,body.leitura .retro .btn,body.leitura .ca{display:none!important}

<div id="toast" class="toast" hidden></div>
<div id="qrOv" class="qrov" hidden><div class="qrgr"><h2>Entre pelo celular</h2><div id="qrcBig"></div><p>Escaneie, escolha seu nome e mexa nos seus cards. A TV mostra na hora.</p><button class="btn pri big" id="qrFecha">Pronto, deixar no canto</button></div></div>
<div id="qrMini" class="qrmini" hidden><button class="x" id="qrX" title="Minimizar" aria-label="Minimizar o QR">–</button><span id="qrcMini"></span>Acompanhe pelo celular</div>

  <div id="gEntrar" style="display:flex;flex-direction:column;gap:10px">
    <input id="gEmail" type="email" inputmode="email" autocomplete="username" placeholder="seu.nome@al.senai.br">
    <div id="gPasso2" hidden style="display:flex;flex-direction:column;gap:10px">

        <input id="gProv" type="text" autocomplete="off" placeholder="Senha provisória (recebida do organizador)">
        <input id="gN1" type="password" autocomplete="new-password" placeholder="Nova senha (mínimo 8 caracteres)">

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
"use strict";
/* ================= datas ================= */
const TZ="America/Maceio",HORA_DAILY="11:30",DUR_DAILY=15*60;
const isoDia=d=>new Intl.DateTimeFormat("en-CA",{timeZone:TZ}).format(d);
const Q=new URLSearchParams(location.search);
const ESPELHO=Q.has("espelho");
const DEMO=Q.has("demo")||ESPELHO;
const DKEY=ESPELHO?"q2-espelho":"q2-demo";
const HOJE=(/^\d{4}-\d\d-\d\d$/.test(Q.get("dia")||"")?Q.get("dia"):isoDia(new Date()));
const meioDia=iso=>new Date(iso+"T12:00:00-03:00");
const addDias=(iso,n)=>{const d=meioDia(iso);d.setUTCDate(d.getUTCDate()+n);return isoDia(d)};
const dow=iso=>meioDia(iso).getUTCDay();
const util=iso=>{const w=dow(iso);return w!==0&&w!==6};
const diasUteis=(a,b)=>{const r=[];if(!a||!b)return r;for(let d=a;d<=b;d=addDias(d,1))if(util(d))r.push(d);return r};
const uAnterior=iso=>{let d=addDias(iso,-1);while(!util(d))d=addDias(d,-1);return d};
const SEM=["dom","seg","ter","qua","qui","sex","sáb"];
const SEMX=["domingo","segunda","terça","quarta","quinta","sexta","sábado"];
const dm=iso=>iso?iso.slice(8,10)+"/"+iso.slice(5,7):"";
const fDia=iso=>iso?SEM[dow(iso)]+" "+dm(iso):"";
const REF=new Date(uAnterior(HOJE)+"T"+HORA_DAILY+":00-03:00").getTime();
const INI_HOJE=new Date(HOJE+"T00:00:00-03:00").getTime();

/* ================= estado ================= */
const S={pessoas:[],cards:{},mov:{},sprints:{},daily:null,cfg:{},projetos:{},comp:{},retro:{},pessoasX:{},rec:{}};
let LEITURA=false;
let TAB="daily",ADMIN=false,MEMBRO=false,QUEM="",MEU=null,FIXO=false,PRONTO=false,QRURL=null;
try{TAB=(location.hash.slice(1)||localStorage.getItem("q2-tab")||"daily")}catch(e){}
try{MEU=localStorage.getItem("q2-eu")}catch(e){}
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const nid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
/* pessoas: membros (participam da daily) e bolsistas (20h/semana, com um membro responsável que atualiza por eles) */
const bolsistas=()=>Object.entries(S.pessoasX).filter(([,x])=>x&&x.ativo!==false&&x.tipo==="bolsista").map(([id,x])=>({id,n:x.n,bol:true,resp:x.resp,pjs:x.pjs||(x.pj?[x.pj]:[]),hsem:+x.hsem||20})).sort((a,b)=>a.n.localeCompare(b.n,"pt"));
/* membros: do cadastro novo (q2_pessoas, tipo membro); enquanto ele estiver vazio, a lista do quadro antigo */
/* papéis: membro e organizador têm raia; coordenador (PO) e só leitura não têm raia nem entram nos ritos de execução */
const PAPEIS={membro:"Membro",org:"Organizador",coord:"Coordenador",leitura:"Só leitura"};
const papelDe=x=>x.papel||(x.org?"org":"membro");
const temRaia=x=>["membro","org"].includes(papelDe(x));
function refreshPessoas(){const M=Object.entries(S.pessoasX).filter(([,x])=>x&&x.tipo==="membro"&&x.ativo!==false&&temRaia(x)).map(([id,x])=>({id,n:x.n,email:x.email||"",org:!!x.org,daily:x.daily!==false,hdia:+x.hdia||8})).sort((a,b)=>a.n.localeCompare(b.n,"pt"));
  const cad=Object.values(S.pessoasX).some(x=>x&&x.tipo==="membro");S.pessoas=cad?M:(S.pessoasBase||[])}
function todos(){const B=bolsistas();const L=[];S.pessoas.forEach(p=>{L.push(p);B.filter(b=>b.resp===p.id).forEach(b=>L.push(b))});B.filter(b=>!S.pessoas.find(p=>p.id===b.resp)).forEach(b=>L.push(b));return L}
const pessoa=id=>todos().find(p=>p.id===id);
const nome=id=>id==="fora"?"alguém de fora":((pessoa(id)||{}).n||id||"");
const rotB=b=>'<span class="bn">↳ '+esc(b.n)+'<em>bolsista</em></span>';
const rot=p=>p.bol?'<span style="font-weight:500;color:var(--muted)">↳ '+esc(p.n)+' <small>(bolsista)</small></span>':esc(p.n);
const partesDia=p=>{const x=pessoa(p);return x&&x.bol?Math.max(1,Math.min(8,Math.round(x.hsem/5))):(x&&x.hdia?Math.max(1,Math.min(8,x.hdia)):8)};
const podeRaia=p=>{if(LEITURA)return false;if(ADMIN||MEU===p)return true;const x=pessoa(p);return !!(x&&x.bol&&x.resp===MEU)};
const sprint=()=>S.sprints[S.cfg.sprint]||null;
function toast(t,ms){const el=$("toast");el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,ms||2600)}
function setSync(t,k){const el=$("sync");el.textContent=t;el.dataset.k=k||""}

/* ================= banco ================= */
const COL={cards:"q2_cards",mov:"q2_mov",sprints:"q2_sprints",daily:"q2_daily",cfg:"q2_config",projetos:"q2_projetos",comp:"q2_comp",retro:"q2_retro",pessoas:"q2_pessoas",rec:"q2_rec"};
let fs=null,DEMOST={};
const DB={
  set(c,id,data){
    if(DEMO){const o=DEMOST[c]||(DEMOST[c]={});o[id]={...(o[id]||{}),...data};Object.keys(o[id]).forEach(k=>{if(o[id][k]===null)delete o[id][k]});saveDemo();aplicarDemo();return Promise.resolve()}
    return fs.collection(COL[c]).doc(id).set(data,{merge:true}).catch(falha)},
  add(c,data){return DB.set(c,nid(),data)}
};
function falha(e){console.error(e);if(e&&e.code==="permission-denied")toast("Sem permissão pra essa mudança.");else toast("Não salvou: "+(e&&(e.code||e.message)))}
function saveDemo(){try{localStorage.setItem(DKEY,JSON.stringify(DEMOST))}catch(e){}}
function aplicarDemo(){S.cards={...(DEMOST.cards||{})};S.mov={...(DEMOST.mov||{})};S.sprints={...(DEMOST.sprints||{})};S.cfg=(DEMOST.cfg||{}).geral||{};S.daily=(DEMOST.daily||{})[HOJE]||null;S.projetos={...(DEMOST.projetos||{})};S.comp={...(DEMOST.comp||{})};S.retro={...(DEMOST.retro||{})};S.pessoasX={...(DEMOST.pessoas||{})};S.rec={...(DEMOST.rec||{})};refreshPessoas();render()}
addEventListener("storage",e=>{if(DEMO&&e.key===DKEY){try{DEMOST=JSON.parse(e.newValue||"{}")}catch(er){}aplicarDemo()}});

/* ================= regras do cartão ================= */
const COLS=[["prev","Previsto pra hoje"],["and","Em andamento"],["trav","Travado"],["conc","Concluído"]];
const EST={prev:"previsto",and:"em andamento",trav:"travado",conc:"concluído"};
const PERG=[["O que fiz desde a última daily?",["and","conc"]],["O que vou fazer até a próxima?",["prev","and"]],["O que está travado?",["trav"]]];
function cardsSprint(){const sp=S.cfg.sprint;return Object.entries(S.cards).filter(([,c])=>c&&!c.apagado&&c.sprint===sp)}
const ehDe=(c,p)=>c.dono===p||(c.com||[]).includes(p);
const podeMexer=c=>ADMIN||(!!MEU&&[c.dono,...(c.com||[])].some(x=>x&&podeRaia(x)));
const ordC=(a,b)=>((+a[1].pri||2)-(+b[1].pri||2))||String(a[1].fim||"9").localeCompare(String(b[1].fim||"9"))||((a[1].criado||0)-(b[1].criado||0));
function raia(p){const my=cardsSprint().filter(([,c])=>ehDe(c,p));
  const k={prev:[],and:[],trav:[],conc:[]};let antes=0;const resto=[];
  my.forEach(e=>{const c=e[1];
    if(c.estado==="conc"){if((c.concEm||0)>=REF)k.conc.push(e);else antes++}
    else if(c.estado==="prev"){if(c.ini&&c.ini<=HOJE)k.prev.push(e);else resto.push(e)}
    else if(k[c.estado])k[c.estado].push(e)});
  Object.values(k).forEach(a=>a.sort(ordC));resto.sort((a,b)=>String(a[1].ini||"9").localeCompare(String(b[1].ini||"9"))||ordC(a,b));
  return {k,antes,resto,my}}
function capacidade(p){const sp=sprint();if(!sp)return null;const dias=diasUteis(sp.ini,sp.fim).length;const base=Math.round(dias*8*0.8*10)/10;
  const desc=+((sp.cap||{})[p]||0);return {dias,base,desc,disp:Math.max(0,Math.round((base-desc)*10)/10)}}
function logMov(id,c,de,para,motivo){DB.add("mov",{card:id,t:c.t,dono:c.dono,de,para,ts:Date.now(),dia:HOJE,por:QUEM,motivo:motivo||""})}
function mover(id,para,extra,motivo){const c=S.cards[id];if(!c)return;if(!podeMexer(c)){toast("Só quem é da raia mexe nesse cartão.");return}
  const de=c.estado,now=Date.now();const p={...(extra||{}),estado:para,atualizado:now};
  if(para==="conc")p.concEm=now;else if(de==="conc")p.concEm=null;
  if(para!=="trav"&&de==="trav")p.trava=null;
  if(para==="prev"&&(!c.ini||c.ini>HOJE)&&!(extra&&"ini" in extra))p.ini=HOJE;
  DB.set("cards",id,p);if(de!==para)logMov(id,c,de,para,motivo)}
function novoCard(p,t,extra){const sp=S.cfg.sprint;if(!sp){toast("Cadastre a sprint primeiro.");return}const id=p+"-"+nid();const now=Date.now();
  const c={t,dono:p,estado:"prev",ini:HOJE,sprint:sp,plan:false,pri:4,pv:2,criado:now,criadoPor:QUEM,atualizado:now,...(extra||{})};
  DB.set("cards",id,c);logMov(id,c,"novo","prev",extra&&extra.pai?"pra destravar outra":"fora da planning");return id}
/* "fiz algo que não estava no quadro": nasce concluído, fora da planning */
function registraFeito(p,t){const sp=S.cfg.sprint;if(!sp){toast("Cadastre a sprint primeiro.");return}const id=p+"-"+nid();const now=Date.now();
  const c={t,dono:p,estado:"conc",concEm:now,ini:HOJE,sprint:sp,plan:false,pri:4,pv:2,criado:now,criadoPor:QUEM,atualizado:now};
  DB.set("cards",id,c);logMov(id,c,"novo","conc","feito fora do quadro");toast("Registrado como feito (fora da planning)")}
function filhos(id){return Object.entries(S.cards).filter(([,c])=>c&&!c.apagado&&c.pai===id)}
/* "mudou desde ontem": cartões com movimento entre a última daily e o começo da de hoje */
function mudouSet(){const ate=(S.daily&&S.daily.inicio)||Date.now();const s=new Set();Object.values(S.mov).forEach(m=>{if(m&&m.ts>=REF&&m.ts<ate)s.add(m.card)});return s}
/* piscar o cartão que mudou ao vivo */
let ANT=null;const FLASH=new Set();
function detectaMudancas(){const atual={};Object.entries(S.cards).forEach(([id,c])=>{if(c)atual[id]=c.estado+"|"+(c.dono||"")});
  if(ANT){Object.keys(atual).forEach(id=>{if(ANT[id]!==atual[id]){FLASH.add(id);setTimeout(()=>FLASH.delete(id),2200)}})}ANT=atual}

/* ================= cartão ================= */
function cardHtml(id,c,col,lane,mud){
  const meta=[];const pn=projNome(c);if(pn)meta.push(esc(pn));if(c.esf)meta.push(c.esf+"h");if(c.fim)meta.push("prazo "+fDia(c.fim));
  const tg=[];
  if(c.fase)tg.push('<span class="tag fase">'+FASES[c.fase]+'</span>');
  if(c.rec)tg.push('<span class="tag">recorrente</span>');
  if(c.dep&&S.cards[c.dep]){const o=S.cards[c.dep];tg.push(o.estado==="conc"?'<span class="tag" style="background:var(--okL);color:var(--ok)">liberada: '+esc(o.t.slice(0,40))+' concluída</span>':'<span class="tag '+(o.estado==="trav"?"late":"due")+'">aguardando: '+esc(o.t.slice(0,40))+' ('+esc(nome(o.dono))+')</span>')}
  if(c.acomp&&S.cards[c.acomp]){const o=S.cards[c.acomp];tg.push('<span class="tag">acompanha: '+esc(o.t.slice(0,40))+' ('+esc(nome(o.dono))+' · '+EST[o.estado]+')</span>')}
  Object.entries(S.cards).forEach(([xid,x])=>{if(!x||x.apagado||x.sprint!==c.sprint)return;if(x.dep===id)tg.push('<span class="tag">libera: '+esc(x.t.slice(0,35))+' ('+esc(nome(x.dono))+')</span>');if(x.acomp===id)tg.push('<span class="tag">acompanhada por '+esc(nome(x.dono))+'</span>')});
  if(+c.pri===1&&col!=="conc")tg.push('<span class="tag pri">prioridade</span>');
  if(col!=="conc"&&c.fim){if(c.fim===HOJE)tg.push('<span class="tag due">prazo hoje</span>');else if(c.fim<HOJE)tg.push('<span class="tag late">prazo vencido</span>')}
  if(col==="prev"&&c.ini&&c.ini<HOJE)tg.push('<span class="tag late">era pra '+fDia(c.ini)+'</span>');
  if(c.remarc)tg.push('<span class="tag due">remarcada'+(c.remarc>1?" "+c.remarc+"x":"")+'</span>');
  if(c.plan===false)tg.push('<span class="tag np">'+(c.pai?"pra destravar":"fora da planning")+'</span>');
  const outros=[c.dono,...(c.com||[])].filter(x=>x&&x!==lane);if(outros.length)tg.push('<span class="tag">'+(lane===c.dono?"com ":"de ")+esc(outros.map(nome).join(", "))+'</span>');
  if(mud&&mud.has(id))tg.push('<span class="tag mud">mudou desde ontem</span>');
  let trava="";

function atendidosHtml(pid,P,pode){const L=P.atendidos||[];if(!L.length)return '';

/* cronograma do atendido: uma barra por etapa, com hoje, marcos do projeto e previsão */
const prevAt=a=>{const f=(a.cron||[]).map(x=>x&&x.fim).filter(Boolean).sort();return f.length?f[f.length-1]:null};
function cronHtml(P,a){const et=etapasAt(P,a);const cr=a.cron||[];const at=a.etapa||0;const conc=atConcluido(P,a);
  return ganttHtml(et.map((e,i)=>{const c=cr[i]||{};const k=conc||i<at?"ok":i===at?"agora":"fut";return {l:(i+1)+". "+esc(e),ini:c.ini,fim:c.fim,k,dd:k==="ok"?"concluída":c.ini&&c.fim?dm(c.ini)+(c.fim!==c.ini?" a "+dm(c.fim):""):"sem data"}}),P.marcos,conc?null:prevAt(a),"Posição no cronograma")}
/* gráfico de barras no tempo: linhas {l (html), ini, fim, k ok|agora|fut, dd}, com hoje, marcos e previsão */
function ganttHtml(rows,marcosP,pv,tit){
  const datas=[HOJE];rows.forEach(x=>{if(x.ini)datas.push(x.ini);if(x.fim)datas.push(x.fim)});
  if(datas.length<3)return "";if(pv)datas.push(pv);const ms=(marcosP||[]).slice().sort((a,b)=>a.data<b.data?-1:1);ms.forEach(m=>datas.push(m.data));
  const ord=datas.slice().sort();let ini=ord[0],fim=ord[ord.length-1];
  const span=(meioDia(fim)-meioDia(ini))/86400000;
  // escala: semanas (até ~4 meses), meses (até ~14 meses) ou trimestres
  const modo=span<=120?"sem":span<=430?"mes":"tri";
  if(modo==="sem"){ini=addDias(ini,-((dow(ini)+6)%7));fim=addDias(fim,7)}else{ini=ini.slice(0,8)+"01";const d=new Date(fim.slice(0,7)+"-15T12:00:00");d.setMonth(d.getMonth()+1);fim=d.toISOString().slice(0,8)+"01"}
  const t0=meioDia(ini).getTime(),t1=meioDia(fim).getTime();const x=d=>Math.max(0,Math.min(100,(meioDia(d).getTime()-t0)/(t1-t0)*100));
  const MES=["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
  const ticks=[];if(modo==="sem"){for(let d=ini;d<fim;d=addDias(d,7))ticks.push([d,dm(d),false])}
  else{let d=new Date(ini+"T12:00:00");while(d.toISOString().slice(0,10)<fim){const iso=d.toISOString().slice(0,10);const m=d.getMonth();const rot=modo==="mes"||m%3===0;ticks.push([iso,rot?MES[m]+(m===0||ticks.length===0?"/"+String(d.getFullYear()).slice(2):""):"",m===0]);d.setMonth(m+1)}}
  const grade=ticks.map(([d,,ano])=>'<i class="gl'+(ano?' ano':'')+'" style="left:'+x(d)+'%"></i>').join("");
  const hojeL=HOJE>=ini&&HOJE<=fim?'<i class="gh" style="left:'+x(HOJE)+'%"></i>':'';
  const prevL=pv&&pv>=ini&&pv<=fim?'<i class="gp" style="left:'+x(pv)+'%"></i>':'';
  // marcos: losangos numerados numa faixa própria, empilhando os que ficam perto
  const niv=[];const mk=ms.filter(m=>m.data>=ini&&m.data<=fim).map(m=>{const p=x(m.data);let n=0;while(niv[n]!=null&&p-niv[n]<4)n++;niv[n]=p;return {p,n,i:ms.indexOf(m)+1,m}});
  const nN=Math.max(1,niv.length);
  const cab='<div class="gr gcab"><span></span><div class="gt">'+ticks.filter(t=>t[1]).map(([d,r])=>'<span style="left:'+x(d)+'%">'+r+'</span>').join("")+
    (hojeL?'<em class="hj" style="left:'+x(HOJE)+'%">hoje</em>':'')+'</div><span></span></div>';
  const linhas=rows.map(c=>{let bar="";if(c.ini&&c.fim){const l=x(c.ini),w=Math.max(.8,x(addDias(c.fim,1))-l);bar='<b class="gb '+c.k+'" style="left:'+l+'%;width:'+w+'%"></b>'}
    return '<div class="gr"><span class="gn">'+c.l+'</span><div class="gt">'+grade+hojeL+prevL+bar+'</div><span class="gd">'+c.dd+'</span></div>'}).join("");
  const faixa=mk.length?'<div class="gr gmk"><span class="gn"><b>Marcos</b></span><div class="gt" style="height:'+(nN*1.55+.3)+'em">'+grade+hojeL+prevL+mk.map(o=>'<span class="gm'+(o.m.data<HOJE?" pass":"")+'" style="left:'+o.p+'%;top:'+(o.n*1.55+.25)+'em" title="M'+o.i+' · '+esc(o.m.t)+' · '+dm(o.m.data)+'">M'+o.i+'</span>').join("")+'</div><span></span></div>':'';
  const rodape=pv?'<div class="gleg"><span><i class="lh"></i>hoje</span><span><i class="lp"></i>fim previsto '+dm(pv)+'</span>'+(mk.length?'<span><i class="lm"></i>marco (Mn = número na lista)</span>':'')+'</div>':'<div class="gleg"><span><i class="lh"></i>hoje</span>'+(mk.length?'<span><i class="lm"></i>marco</span>':'')+'</div>';
  return '<div class="sub2">'+tit+'</div><div class="gant">'+cab+linhas+faixa+'</div>'+rodape}

function caiEm(r,d){if(d<r.ini||d>r.ate)return false;
  if(r.freq==="mes"){let t=d.slice(0,8)+r.ini.slice(8);while(!util(t))t=addDias(t,1);return d===t}
  if(!(r.dias||[]).includes(dow(d)))return false;
  if(r.freq==="quin")return Math.floor((meioDia(d)-meioDia(r.ini))/(7*86400000))%2===0;return true}

    diasUteis(sp.ini,sp.fim).filter(d=>caiEm(r,d)).forEach(d=>{const cid="rec-"+rid+"-"+d;if(S.cards[cid]&&!(S.cards[cid].apagado&&S.cards[cid].foraDatas))return;const part=r.part||[];if(!part.length)return;
      const bl=[];for(let k=0;k<r.dur;k++){const pt=+r.tu+(+r.pi||0)+k;if(pt<8)bl.push(d+"#"+pt)}
      const c={t:r.t,pj:r.pj||null,at:r.at||null,cat:r.cat||null,dono:part[0],com:part.slice(1),esf:+r.dur,estado:"prev",sprint:sid,plan:true,rec:rid,ini:d,blocos:bl,fase:r.fase||"exec",pri:4,pv:2,criado:now,criadoPor:"recorrente",atualizado:now,apagado:false,foraDatas:false};
      DB.set("cards",cid,c);n++})});return n}

function isoDeDM(s){if(!s||!/^\d\d\/\d\d$/.test(s))return null;const d=s.slice(0,2),m=+s.slice(3,5);return (m<8?2027:2026)+"-"+String(m).padStart(2,"0")+"-"+d}
function converter(A,spId,spIni){const out={};const movs=Object.values(A.mov||{});
  for(const [id,c] of Object.entries(A.cards||{})){if(!c||c.s!=="sim")continue;
    if(!(c.sp===dm(spIni)||(!c.sp&&c.origem==="daily"&&String(c.criado||"")>=spIni)))continue;
    const d=(A.dly||{})[id]||{};const st={conc:"conc",and:"and",trav:"trav",hoje:"prev"}[d.st]||"prev";
    let ini=isoDeDM(c.ini);if(d.st==="hoje"&&d.dia)ini=isoDeDM(d.dia)||ini;
    let concEm=null;if(st==="conc"){const m=movs.filter(m=>m&&m.card===id&&m.para==="conc").sort((a,b)=>b.ts-a.ts)[0];concEm=m?m.ts:(d.ts||Date.now())}
    const n={t:c.t||"",dono:c.col,estado:st,sprint:spId,plan:c.origem!=="daily",pri:c.pri?+c.pri:(c.prio?1:2),criado:c.criado?Date.parse(c.criado):(c.ts||Date.now()),criadoPor:"quadro antigo",origem:id};
    if(c.proj)n.proj=c.proj;if(c.esf)n.esf=+c.esf;if(ini)n.ini=ini;const fim=isoDeDM(c.fim);if(fim)n.fim=fim;if(c.com&&c.com.length)n.com=c.com;
    if(c.pai)n.pai=c.pai;if(c.hist&&c.hist.length)n.remarc=c.hist.length;
    if(concEm)n.concEm=concEm;if(st==="trav")n.trava={txt:d.trava||"",desde:d.ts||Date.now()};
    out[id]=n}
  return out}
async function lerAntigo(){if(DEMO)return window.DEMO_ANTIGO;const A={};for(const k of ["cards","dly","mov"]){const sn=await fs.collection(k).get();A[k]={};sn.docs.forEach(d=>A[k][d.id]=d.data())}return A}

function qrMostra(){const ok=ADMIN&&!!QRURL;const rito=TAB==="daily"||TAB==="plan";$("qrBtn").hidden=!ok;
  $("qrOv").hidden=!(ok&&QRM==="grande");$("qrMini").hidden=!(ok&&rito&&QRM==="canto");$("qrTab").hidden=!(ok&&rito&&QRM==="aba");
  if(ok&&QRM==="grande")desenhaQR($("qrcBig"),340);if(ok)desenhaQR($("qrcMini"),140)}
$("qrBtn").onclick=()=>qrModo("grande");
$("qrFecha").onclick=()=>qrModo("canto");
$("qrOv").addEventListener("click",e=>{if(e.target===$("qrOv"))qrModo("canto")});
$("qrTab").onclick=()=>qrModo("canto");
async function makeQR(){if(QRURL)return;if(DEMO){QRURL=location.origin+location.pathname+"?demo&membro&dia="+HOJE+"#eu";qrMostra();return}let id=null;try{const v=JSON.parse(localStorage.getItem("q2-qr")||"null");if(v&&v.dia===HOJE)id=v.id}catch(e){}
  if(!id){const a=crypto.getRandomValues(new Uint8Array(16));id=[...a].map(b=>(b%36).toString(36)).join("");
    try{await fs.collection("codigos").doc(id).set({ate:firebase.firestore.Timestamp.fromDate(new Date(HOJE+"T23:59:59-03:00")),criado:firebase.firestore.FieldValue.serverTimestamp()})}catch(e){toast("Não gerou o QR: "+(e.code||e.message));return}
    localStorage.setItem("q2-qr",JSON.stringify({dia:HOJE,id}))}
  QRURL=location.origin+location.pathname+"?c="+id+"#eu";qrMostra()}
function desenhaQR(el,w){if(!el||!QRURL)return;if(el.dataset.u===QRURL&&el.firstChild)return;el.innerHTML="";el.dataset.u=QRURL;if(window.QRCode)new QRCode(el,{text:QRURL,width:w,height:w,correctLevel:QRCode.CorrectLevel.M});else el.textContent=QRURL}
$("qrMini").addEventListener("click",e=>{if(e.target.closest("#qrX")){qrModo("aba");return}qrModo("grande")});
if(DEMO&&!ESPELHO){const s=document.createElement("script");s.src="demo.js";s.onload=start;s.onerror=()=>{window.DEMO_ANTIGO={equipe:[],cards:{},dly:{},mov:{}};start()};document.head.appendChild(s)}else start();
</script>
</body>
